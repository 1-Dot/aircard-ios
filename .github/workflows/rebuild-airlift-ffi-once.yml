name: Rebuild AirliftFFI Once

on:
  push:
    branches:
      - final/wallet-original-artwork
    paths:
      - ".github/workflows/rebuild-airlift-ffi-once.yml"

permissions:
  contents: write

jobs:
  rebuild-ffi:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: final/wallet-original-artwork
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rebuild AirliftFFI XCFramework
        run: |
          chmod +x build-ios.sh
          DEVELOPER_DIR="$(xcode-select -p)" ./build-ios.sh

      - name: Verify export symbol
        run: |
          grep -q 'al_exploit_export_file' AirliftFFI.xcframework/ios-arm64/Headers/airlift.h
          nm -gU AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a | grep '_al_exploit_export_file'

      - name: Commit refreshed framework
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AirliftFFI.xcframework
          if git diff --cached --quiet; then
            echo "AirliftFFI.xcframework already current"
            exit 0
          fi
          git commit -m "build: refresh AirliftFFI xcframework"
          git push origin HEAD:final/wallet-original-artwork
