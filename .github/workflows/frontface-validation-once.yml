name: One-time FrontFace Validation

on:
  push:
    branches:
      - test/scan-backup-preview-fallback
    paths:
      - ".github/workflows/frontface-validation-once.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Rebuild XCFramework
        run: |
          chmod +x build-ios.sh
          DEVELOPER_DIR="$(xcode-select -p)" ./build-ios.sh

      - name: Regenerate Xcode project
        run: xcodegen generate

      - name: Compile unit-test target
        run: |
          xcodebuild \
            -project AirCard-iOS.xcodeproj \
            -target AirCard-iOSTests \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build unsigned IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh Release

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-frontface-final
          path: build/AirCard-iOS.ipa
          if-no-files-found: error
          retention-days: 3
