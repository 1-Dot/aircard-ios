name: Build AirCard-iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: build/AirCard-iOS.ipa
